name: .NET

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore Akeyless.DotNet.Samples.sln
      - name: Build
        run: dotnet build Akeyless.DotNet.Samples.sln -c Release --no-restore
      - name: Test
        run: dotnet test Akeyless.DotNet.Samples.sln -c Release --no-build --verbosity normal
